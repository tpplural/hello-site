{% extends "base.html" %}

{# Menu item 3 (Figma frame with a single banner): banner with illustration + title, markdown body below. #}
{% block content %}
<div class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8 space-y-6">
  <section class="rounded-md bg-primary-800 p-6 flex items-center gap-6">
    {{<ui.placeholder label="ilustracja: grzyb" class="h-32 w-32 shrink-0" />}}
    <h1 class="text-2xl font-bold text-primary-100 ml-auto">{{ page.title }}</h1>
  </section>
  <article class="prose">
    {{ page.content | safe }}
  </article>
</div>
{% endblock content %}
